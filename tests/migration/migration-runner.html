<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LaunchPad Migration Native IndexedDB Runner</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px; background: #0f172a; color: #f8fafc; }
    h1 { color: #38bdf8; }
    .suite { margin-bottom: 15px; padding: 12px; border-radius: 6px; background: #1e293b; border-left: 5px solid #22c55e; }
    .suite.failed { border-left-color: #ef4444; }
    .passed { color: #4ade80; }
    .failed { color: #f87171; }
  </style>
</head>
<body>
  <h1>LaunchPad Stage 2B — Native IndexedDB Migration Runner</h1>
  <div id="status">Executing native IndexedDB migration tests in browser...</div>
  <div id="log"></div>

  <script type="module">
    import { runNativeMigrationTests } from './nativeMigrationSuite.ts';

    // Forward console logs to harness server
    const origLog = console.log;
    console.log = (...args) => {
      origLog(...args);
      fetch('/api/log', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(args.join(' '))
      }).catch(() => {});
    };

    const origErr = console.error;
    console.error = (...args) => {
      origErr(...args);
      fetch('/api/log', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify('[ERR] ' + args.join(' '))
      }).catch(() => {});
    };

    async function execute() {
      const statusEl = document.getElementById('status');
      const logEl = document.getElementById('log');

      try {
        console.log('Native migration test execution starting in Orca browser...');
        const report = await runNativeMigrationTests();

        statusEl.innerHTML = report.passed
          ? `<span class="passed">✓ ALL NATIVE MIGRATION TESTS PASSED (${report.durationMs.toFixed(1)}ms)</span>`
          : `<span class="failed">❌ NATIVE TESTS FAILED (${report.durationMs.toFixed(1)}ms)</span>`;

        for (const suite of report.suites) {
          const div = document.createElement('div');
          div.className = `suite ${suite.passed ? 'passed' : 'failed'}`;
          div.innerHTML = `<strong>${suite.suite}</strong> (${suite.durationMs.toFixed(1)}ms)<br>` +
            suite.assertions.map(a =>
              `  ${a.passed ? '✓' : '❌'} ${a.name} (${a.durationMs.toFixed(1)}ms)` +
              (a.error ? `<pre style="color:#ef4444">${a.error}</pre>` : '')
            ).join('<br>');
          logEl.appendChild(div);
        }

        // Send results back to node runner
        await fetch('/api/test-results', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(report)
        });
      } catch (err) {
        console.error('Fatal runner error:', err);
        statusEl.innerHTML = `<span class="failed">Fatal error: ${err.message}</span>`;
        await fetch('/api/test-results', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            browser: 'Orca Built-in Browser',
            userAgent: navigator.userAgent,
            passed: false,
            suites: [],
            durationMs: 0,
            error: String(err)
          })
        }).catch(() => {});
      }
    }

    execute();
  </script>
</body>
</html>
